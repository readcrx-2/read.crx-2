name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# 同じブランチへ連続でpushしたとき、古い実行を止めてランナーを無駄にしない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: 静的解析と型チェック
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit -p .

      # vp checkは変更コードだけへ実行し、既存の未変更フォーマット差分を除外する。
      - name: Check changed code files
        if: ${{ !cancelled() }}
        run: node scripts/check-changed-files.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          CI_DIFF_BASE: ${{ github.event.before }}

  unit:
    name: ユニットテスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # package.json の devEngines が pnpm 12.9.0 / Node 25 以上を要求しているため合わせる。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:coverage

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
          if-no-files-found: ignore

  e2e:
    name: E2Eテスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tests/fixtures.mts は channel: "chromium" で拡張機能を読み込むため、
      # Playwright同梱のChromiumとOS依存ライブラリを入れる。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # test:e2e はChrome拡張版をビルドしてから debug/chrome を読み込んで検証する。
      - name: Run E2E tests
        run: pnpm run test:e2e

      # 失敗時にトレースとスクリーンショットから原因を追えるよう、結果を残す。
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
