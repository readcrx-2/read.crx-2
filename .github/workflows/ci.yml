name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# 同じブランチへ連続でpushしたとき、古い実行を止めてランナーを無駄にしない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: 静的解析と型チェック
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Type check
        run: pnpm exec tsc --noEmit -p .

      # vp checkは変更コードだけへ実行し、既存の未変更フォーマット差分を除外する。
      - name: Check changed code files
        if: ${{ !cancelled() }}
        run: node scripts/check-changed-files.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          CI_DIFF_BASE: ${{ github.event.before }}

      # 層・機能・core への依存の境界と循環 import は、変更していないファイルの import 先が
      # 動いたり消えたりしても崩れるため、src 全体へ lint をかける（docs/plans/module-boundaries-plan.md）。
      # フォーマットは上の変更ファイルだけの検査に任せ、ここでは lint のエラーだけで失敗させる。
      - name: Lint all source files
        if: ${{ !cancelled() }}
        run: pnpm exec vp lint src/

  rust-coverage:
    name: Rustカバレッジ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust with coverage tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # tauri::generate_context!() はコンパイル時に frontendDist の存在を検査する。
      # Rustの単体テストはフロントの成果物を使わないため、ビルドせず空ディレクトリで満たす。
      - name: Prepare frontendDist placeholder
        run: mkdir -p debug/tauri

      - name: Run Rust tests and generate coverage
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib --summary-only
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --html --output-dir coverage/rust

      - name: Upload Rust coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust/html
          if-no-files-found: error

  unit:
    name: ユニットテスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Run unit tests
        run: pnpm run test:coverage

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit
          if-no-files-found: ignore

  e2e:
    name: E2Eテスト
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      # tests/fixtures.mts は channel: "chromium" で拡張機能を読み込むため、
      # Playwright同梱のChromiumとOS依存ライブラリを入れる。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # ユニットテストとは独立してE2Eを実行し、E2E単体のカバレッジを生成する。
      - name: Run E2E tests and generate coverage
        run: pnpm run test:e2e:coverage

      # 統合ジョブが各レポートを取得できるようにする。
      - name: Upload E2E coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage/e2e
          if-no-files-found: ignore

      # 失敗時にトレースとスクリーンショットから原因を追えるよう、結果を残す。
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  combined-coverage:
    name: カバレッジ統合
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit

      - name: Download E2E coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-e2e
          path: coverage/e2e

      - name: Combine coverage
        run: pnpm run test:coverage:merge

      - name: Upload combined coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: coverage/combined
          if-no-files-found: ignore
