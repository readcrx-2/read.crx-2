name: Release Tauri Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "25"

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.9.0
          install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version in tauri.conf.json
        run: |
          $content = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $content.version = '${{ github.event.inputs.version }}'
          $content | ConvertTo-Json -Depth 10 | Set-Content 'src-tauri/tauri.conf.json'

      - name: Build Tauri Windows
        run: pnpm build:tauri

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/chlens.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
