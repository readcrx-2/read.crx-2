name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the release-it tag to publish (without the v prefix)."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 変更理由: release-itが作成・pushしたタグの内容から配布物を作る。
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      # 変更理由: タグ時点のpackage.jsonのdevEnginesはpnpm 12.9.0を要求する。
      # 11.13.0 + action-setup@v4 ではpnpm 12の実行ファイルをNodeが読み込もうとして
      # install が SyntaxError で失敗し、リリース成果物が作られなかったため、ci.ymlと揃える。
      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.9.0
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 変更理由: release-it側ではバージョン・タグを確定し、Actions側で拡張機能をビルドして公開する。
      - name: Build release packages
        run: pnpm run release:build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/chlens-chrome-v${{ inputs.version }}.zip
            release/chlens-firefox-v${{ inputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
