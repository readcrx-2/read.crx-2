packages:
  - "."
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  dtrace-provider: true
  es5-ext: true
  esbuild: true
  msw: true
  optipng-bin: true
  pngquant-bin: true
  sharp: true
  spawn-sync: true
  zopflipng-bin: true

onlyBuiltDependencies:
  - "@parcel/watcher"
  - core-js
  - dtrace-provider
  - es5-ext
  - esbuild
  - fsevents
  - msw
  - sharp
  - spawn-sync
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.2.0
# Version 4.0.0 is an intentional direct dependency; keep the release-age
# protection enabled for every other package.
minimumReleaseAgeExclude:
  - "@toon-format/toon"
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
