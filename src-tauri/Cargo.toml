[package]
name = "chlens"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
base64 = "0.22"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# reqwest標準Jarはメモリ内だけなので、期限付きの投稿Cookieを保存・復元できるストアを使う。
cookie_store = "0.22"
# releaseビルドでもDevToolsを開けるようにするため有効化
tauri = { version = "2.11.0", features = ["devtools"] }
tauri-plugin-log = "2"
# Tauri版の書き込みはJSのHeaders制約を避け、Cookieを同じClientで確認POSTまで保持する。
reqwest = { version = "0.12", default-features = false, features = [
  "cookies",
  "http2",
  "rustls-tls",
  "charset",
  "system-proxy",
] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
httpdate = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # 投稿Cookieの保存ファイルをログオンユーザーの鍵（DPAPI）で暗号化する。
  "Win32_Security_Cryptography",
  # 追従先を再起動後にも探せるよう、実行ファイルのパスを取得する。
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# E2E用ビルドだけが環境変数 CHLENS_DATA_DIR で保存先を差し替えられるようにする（src/data_dir.rs）。
e2e = []

[[bin]]
name = "chlens"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
